# 单实例约束：SQLite 写锁 + 调度器不可重复注册，禁止扩容副本数
services:
  migrate:
    image: crpi-5rhaq5x8z5ec9tig-vpc.cn-hangzhou.personal.cr.aliyuncs.com/ryanruiliu/status-panel:${TAG:?TAG must be set}
    restart: "no"
    user: "33:33"
    env_file:
      - status-panel.env
    environment:
      DB_PATH: /data/status-panel.db
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["alembic", "upgrade", "head"]

  status-panel:
    image: crpi-5rhaq5x8z5ec9tig-vpc.cn-hangzhou.personal.cr.aliyuncs.com/ryanruiliu/status-panel:${TAG:?TAG must be set}
    container_name: status-panel
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    user: "33:33"
    env_file:
      - status-panel.env
    environment:
      DB_PATH: /data/status-panel.db
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - web

  litestream:
    image: crpi-5rhaq5x8z5ec9tig-vpc.cn-hangzhou.personal.cr.aliyuncs.com/ryanruiliu/litestream:${TAG:?TAG must be set}
    container_name: status-panel-litestream
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    user: "33:33"
    command: ["replicate"]
    volumes:
      - ./data:/data
      - ./backup:/backup
      - ./deploy/litestream.yml:/etc/litestream.yml:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web:
    external: true
