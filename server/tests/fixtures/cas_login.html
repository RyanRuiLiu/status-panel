<script type="text/javascript">
$(function(){

	$('#retrievePassId').attr('href', "/retrieve-password/passwordMobile/index.html?t="+new Date().getTime());
    $("#activationAccountId").attr("href","/retrieve-password/activationMobile/index.html?t="+new Date().getTime());
	if(service == '' || !service){
		service = '';//saml后缀
	}
	if(service != ""){
		$("#loginFromId").attr("action",$("#loginFromId").attr("action")+"?service="+encodeURIComponent(service));
		$("#mobileTab").attr("href",$("#mobileTab").attr("href")+"&skip=skip&service="+encodeURIComponent(service));
		$("#accountTab").attr("href",$("#accountTab").attr("href")+"&skip=skip&service="+encodeURIComponent(service));
		//忘记密码帐号激活
		$("#retrievePassId").attr("href",$("#retrievePassId").attr("href")+"&service="+encodeURIComponent(service));
        $("#activationAccountId").attr("href",$("#activationAccountId").attr("href")+"&service="+encodeURIComponent(service));
		//qq联合认证
        $("#mobile_combinedLogin_a_qq").attr("href",$("#mobile_combinedLogin_a_qq").attr("href")+"&success="+encodeURIComponent(service));
        //校外用户登录
        $("#mobile_outUserLogin_a").attr("href",$("#mobile_outUserLogin_a").attr("href")+"&service="+encodeURIComponent(service));

	}
	var loginType = "";
	if(!loginType){
        loginType = "";
		$("#dllt").val(loginType);
	}
	if(loginType != ''){
		$("#mobileTab").attr("href",$("#mobileTab").attr("href")+"&skip=skip&login_type="+loginType);
		$("#accountTab").attr("href",$("#accountTab").attr("href")+"&skip=skip&login_type="+loginType);
		$("#dllt").val(loginType);
	}
});
</script>
