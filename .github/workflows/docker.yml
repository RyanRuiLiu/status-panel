name: docker

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  docker:
    permissions:
      contents: read
    uses: RyanRuiLiu/.github/.github/workflows/docker.yml@9e85e2e21780ed63ba09054f504a8d2139d87a9d
    with:
      tags: |
        type=ref,event=branch
    secrets:
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}

  deploy:
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy-status-panel
      cancel-in-progress: false
    uses: RyanRuiLiu/.github/.github/workflows/deploy.yml@655a30434585fe049b55d25aaee77ad1caeddcc8
    with:
      hook: deploy-status-panel
    secrets:
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
