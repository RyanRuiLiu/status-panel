name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check app tests scripts
      - run: uv run ruff format --check app tests scripts
      - run: uv run pyright
      - run: uv run pytest --cov=app --cov-report=term-missing

  miniprogram:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniprogram
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: miniprogram/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
