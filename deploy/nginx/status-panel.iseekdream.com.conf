limit_req_zone $binary_remote_addr zone=status-panel:10m rate=30r/s;

server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name status-panel.iseekdream.com;

    ssl_certificate /etc/letsencrypt/live/iseekdream.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iseekdream.com/privkey.pem;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        limit_req zone=status-panel burst=60 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;
        proxy_pass http://127.0.0.1:8120;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @rate_limited {
        add_header Retry-After 30 always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        default_type application/json;
        return 429 '{"error": "too_many_requests", "detail": "请求过于频繁，请稍后重试"}';
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name status-panel.iseekdream.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
